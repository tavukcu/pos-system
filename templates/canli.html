{% extends "base.html" %}
{% block title %}Canli Satis Takip - POS{% endblock %}
{% block content %}
<div class="page-header canli-header">
    <h1>Canli Satis</h1>
    <div class="canli-status">
        <span id="son-guncelleme"></span>
        <span class="canli-dot"></span>
        <span class="canli-label">CANLI</span>
    </div>
</div>

<div class="canli-stats">
    <div class="stat-card">
        <div class="label">Ciro</div>
        <div class="value success" id="c-ciro">--</div>
    </div>
    <div class="stat-card">
        <div class="label">Islem</div>
        <div class="value primary" id="c-adet">--</div>
    </div>
    <div class="stat-card">
        <div class="label">Ort. Fis</div>
        <div class="value warning" id="c-ort">--</div>
    </div>
</div>

<div class="canli-grid">
    <div class="card">
        <h2>Eleman Performansi</h2>
        <div id="eleman-chart" style="padding:8px 0"></div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Eleman</th><th>Islem</th><th>Ciro</th><th>Oran</th></tr></thead>
                <tbody id="eleman-table"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="card">
    <h2>Bugunun Satislari</h2>
    <div class="table-wrapper">
        <table class="satis-tablo">
            <thead><tr><th>Saat</th><th>Eleman</th><th>Musteri</th><th>Tutar</th></tr></thead>
            <tbody id="satis-table"></tbody>
        </table>
    </div>
</div>

<style>
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}
@keyframes highlight {
    from { background: #dbeafe; }
    to { background: transparent; }
}
.canli-header { flex-wrap: wrap; gap: 8px; }
.canli-header h1 { font-size: 20px; }
.canli-status { display: flex; align-items: center; gap: 6px; }
.canli-status #son-guncelleme { color: var(--text-light); font-size: 11px; }
.canli-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
.canli-label { font-size: 12px; color: var(--success); font-weight: 700; }

.canli-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.canli-stats .stat-card { padding: 14px; }
.canli-stats .stat-card .value { font-size: 22px; }
.canli-stats .stat-card .label { font-size: 11px; }

.canli-grid { margin-bottom: 16px; }

.eleman-bar-container { margin-bottom: 10px; }
.eleman-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; font-weight: 600; }
.eleman-bar-track { height: 24px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.eleman-bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; color: #fff; }

.satis-row-new { animation: highlight 2s ease; }
.satis-tablo td, .satis-tablo th { padding: 8px; font-size: 13px; }

@media (max-width: 768px) {
    .canli-stats .stat-card .value { font-size: 18px; }
    .canli-stats .stat-card .label { font-size: 10px; }
    .canli-stats .stat-card { padding: 10px; }
    .canli-stats { gap: 6px; margin-bottom: 12px; }
    .canli-header h1 { font-size: 16px; }
    .card { padding: 14px; margin-bottom: 12px; }
    .card h2 { font-size: 15px; margin-bottom: 10px; }
    .satis-tablo td, .satis-tablo th { padding: 6px 4px; font-size: 12px; }
    .eleman-bar-label { font-size: 11px; }
    .eleman-bar-track { height: 22px; }
    .eleman-bar-fill { font-size: 10px; }
}
</style>
{% endblock %}

{% block scripts %}
<script>
const RENEW_INTERVAL = 30; // saniye
const RENKLER = ['#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
let oncekiSatislar = [];

async function yukle() {
    try {
        const data = await fetch('/api/rapor/canli').then(r => r.json());

        // Ozet
        document.getElementById('c-ciro').textContent = formatMoney(data.ozet.toplam_ciro);
        document.getElementById('c-adet').textContent = data.ozet.islem_adedi;
        document.getElementById('c-ort').textContent = formatMoney(data.ozet.ort_fis);

        // Eleman tablosu
        const toplamCiro = data.ozet.toplam_ciro || 1;
        document.getElementById('eleman-table').innerHTML = data.elemanlar.map(e => {
            const oran = ((e.toplam_ciro / toplamCiro) * 100).toFixed(1);
            return `<tr>
                <td><strong>${e.ad || 'Bilinmiyor'}</strong></td>
                <td>${e.islem_adedi}</td>
                <td><strong>${formatMoney(e.toplam_ciro)}</strong></td>
                <td><span class="badge badge-primary">${oran}%</span></td>
            </tr>`;
        }).join('') || '<tr><td colspan="4">Henuz satis yok</td></tr>';

        // Eleman bar chart
        const maxCiro = Math.max(...data.elemanlar.map(e => e.toplam_ciro), 1);
        document.getElementById('eleman-chart').innerHTML = data.elemanlar.map((e, i) => {
            const pct = (e.toplam_ciro / maxCiro) * 100;
            const renk = RENKLER[i % RENKLER.length];
            return `<div class="eleman-bar-container">
                <div class="eleman-bar-label">
                    <span>${e.ad || 'Bilinmiyor'}</span>
                    <span>${formatMoney(e.toplam_ciro)}</span>
                </div>
                <div class="eleman-bar-track">
                    <div class="eleman-bar-fill" style="width:${pct}%;background:${renk}">
                        ${e.islem_adedi} islem
                    </div>
                </div>
            </div>`;
        }).join('') || '<p style="color:var(--text-light)">Henuz satis yok</p>';

        // Satis tablosu
        const yeniIdler = data.satislar.map(s => s.id);
        const oncekiIdler = oncekiSatislar.map(s => s.id);

        document.getElementById('satis-table').innerHTML = data.satislar.map(s => {
            const yeniMi = oncekiSatislar.length > 0 && !oncekiIdler.includes(s.id);
            return `<tr class="${yeniMi ? 'satis-row-new' : ''}" style="cursor:pointer" onclick="showSatisDetay('${s.id}',${s.fis_no},'${s.tarih}')">
                <td><strong>${s.saat}</strong></td>
                <td><span class="badge badge-success">${s.eleman || '-'}</span></td>
                <td>${s.musteri || '-'}</td>
                <td><strong>${formatMoney(s.tutar)}</strong></td>
            </tr>`;
        }).join('') || '<tr><td colspan="4">Henuz satis yok</td></tr>';

        oncekiSatislar = data.satislar;

        // Son guncelleme
        const simdi = new Date();
        document.getElementById('son-guncelleme').textContent =
            'Son guncelleme: ' + simdi.toLocaleTimeString('tr-TR');
    } catch (err) {
        console.error('Canli veri yuklenemedi:', err);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    yukle();
    setInterval(yukle, RENEW_INTERVAL * 1000);
});
</script>
{% endblock %}
