{% extends "base.html" %}
{% block title %}Musteriler - POS{% endblock %}
{% block content %}
<div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <h1>Musteriler</h1>
    <button class="btn btn-primary" onclick="openForm(null)">+ Yeni Musteri</button>
</div>

<div class="search-bar">
    <input type="text" id="musteri-search" placeholder="Ad, soyad veya telefon ile ara...">
    <button class="btn btn-primary" onclick="searchMusteriler()">Ara</button>
</div>

<div class="card">
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Ad Soyad</th>
                    <th>Telefon</th>
                    <th>Il</th>
                    <th style="width:60px"></th>
                </tr>
            </thead>
            <tbody id="musteri-table"></tbody>
        </table>
    </div>
</div>

<!-- EKLE / DUZENLE MODAL -->
<div id="form-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1100;justify-content:center;align-items:center">
    <div style="background:#fff;border-radius:12px;padding:24px;max-width:420px;width:92%;position:relative">
        <button onclick="closeForm()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;cursor:pointer">&times;</button>
        <h3 id="form-baslik" style="margin:0 0 20px"></h3>
        <input type="hidden" id="form-id">
        <div class="form-group" style="margin-bottom:14px">
            <label style="font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:4px">Ad *</label>
            <input type="text" id="f-adi" placeholder="Ad" style="width:100%;padding:10px;border:1px solid #dee2e6;border-radius:8px;font-size:14px;box-sizing:border-box">
        </div>
        <div class="form-group" style="margin-bottom:14px">
            <label style="font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:4px">Soyad</label>
            <input type="text" id="f-soyadi" placeholder="Soyad" style="width:100%;padding:10px;border:1px solid #dee2e6;border-radius:8px;font-size:14px;box-sizing:border-box">
        </div>
        <div class="form-group" style="margin-bottom:14px">
            <label style="font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:4px">Telefon</label>
            <input type="tel" id="f-telefon" placeholder="05xx xxx xx xx" style="width:100%;padding:10px;border:1px solid #dee2e6;border-radius:8px;font-size:14px;box-sizing:border-box">
        </div>
        <div class="form-group" style="margin-bottom:20px">
            <label style="font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:4px">Il</label>
            <input type="text" id="f-il" placeholder="Il" style="width:100%;padding:10px;border:1px solid #dee2e6;border-radius:8px;font-size:14px;box-sizing:border-box">
        </div>
        <div id="form-hata" style="color:#dc3545;font-size:13px;margin-bottom:12px;display:none"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-secondary" onclick="closeForm()">Iptal</button>
            <button class="btn btn-primary" id="form-kaydet" onclick="kaydetMusteri()">Kaydet</button>
        </div>
    </div>
</div>

<!-- GECMIS MODAL -->
<div id="gecmis-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center">
    <div style="background:#fff;border-radius:12px;padding:24px;max-width:720px;width:95%;max-height:90vh;overflow-y:auto;position:relative">
        <button onclick="closeGecmis()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;cursor:pointer">&times;</button>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;flex-wrap:wrap;gap:8px">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <h3 id="gm-baslik" style="margin:0"></h3>
                <span id="gm-badge" style="display:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px"></span>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
                <button id="gm-wa" onclick="gmOpenWA()" style="display:none;padding:4px 12px;font-size:12px;background:#25D366;border:none;border-radius:8px;color:#fff;cursor:pointer;font-weight:600">WA</button>
                <a id="gm-export" href="#" class="btn btn-secondary" style="padding:4px 12px;font-size:12px;white-space:nowrap">&#8595; Excel</a>
            </div>
        </div>
        <p id="gm-telefon" style="margin:0 0 14px;color:#666;font-size:13px"></p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px" id="gm-ozet"></div>
        <div id="gm-odeme" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>
        <h4 style="margin:0 0 8px;font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.5px">Son 12 Ay Harcama</h4>
        <div id="gm-chart" class="chart-container" style="height:110px;margin-bottom:16px"></div>
        <h4 style="margin:0 0 8px;font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.5px">Son 50 Alisveris</h4>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Tarih</th><th>Saat</th><th>Fis No</th><th>Odeme</th>
                        <th style="text-align:right">Tutar</th><th></th>
                    </tr>
                </thead>
                <tbody id="gm-satislar"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => loadMusteriler());
document.getElementById('musteri-search').addEventListener('keydown', e => { if (e.key === 'Enter') searchMusteriler(); });

async function loadMusteriler() {
    const data = await fetch('/api/musteriler').then(r => r.json());
    renderMusteriler(data);
}

async function searchMusteriler() {
    const q = document.getElementById('musteri-search').value.trim();
    const data = await fetch('/api/musteriler?q=' + encodeURIComponent(q)).then(r => r.json());
    renderMusteriler(data);
}

function renderMusteriler(data) {
    document.getElementById('musteri-table').innerHTML = data.map(m => `
        <tr>
            <td style="cursor:pointer" onclick="showGecmis(${m.id}, '${esc(m.adi)} ${esc(m.soyadi)}', '${esc(m.telefon)}')">
                <strong>${esc(m.adi)} ${esc(m.soyadi)}</strong>
            </td>
            <td>${esc(m.telefon)}</td>
            <td>${esc(m.il)}</td>
            <td>
                <button class="btn btn-secondary" style="padding:2px 8px;font-size:11px"
                    onclick="event.stopPropagation();openForm(${JSON.stringify(m)})">Duzenle</button>
            </td>
        </tr>
    `).join('') || '<tr><td colspan="4" style="text-align:center;color:#999">Sonuc bulunamadi</td></tr>';
}

// --- EKLE / DUZENLE ---

function openForm(m) {
    document.getElementById('form-id').value = m ? m.id : '';
    document.getElementById('form-baslik').textContent = m ? 'Musteri Duzenle' : 'Yeni Musteri';
    document.getElementById('f-adi').value = m ? m.adi : '';
    document.getElementById('f-soyadi').value = m ? m.soyadi : '';
    document.getElementById('f-telefon').value = m ? m.telefon : '';
    document.getElementById('f-il').value = m ? m.il : '';
    document.getElementById('form-hata').style.display = 'none';
    document.getElementById('form-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('f-adi').focus(), 50);
}

function closeForm() {
    document.getElementById('form-modal').style.display = 'none';
}

document.getElementById('form-modal').addEventListener('click', function(e) {
    if (e.target === this) closeForm();
});

async function kaydetMusteri() {
    const id = document.getElementById('form-id').value;
    const body = {
        adi:     document.getElementById('f-adi').value.trim(),
        soyadi:  document.getElementById('f-soyadi').value.trim(),
        telefon: document.getElementById('f-telefon').value.trim(),
        il:      document.getElementById('f-il').value.trim(),
    };
    if (!body.adi && !body.soyadi) {
        const hata = document.getElementById('form-hata');
        hata.textContent = 'Ad veya soyad gerekli';
        hata.style.display = 'block';
        return;
    }

    const btn = document.getElementById('form-kaydet');
    btn.disabled = true; btn.textContent = 'Kaydediliyor...';

    try {
        const url = id ? `/api/musteri/${id}/guncelle` : '/api/musteri/ekle';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, {
            method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        }).then(r => r.json());

        if (res.ok) {
            closeForm();
            const q = document.getElementById('musteri-search').value.trim();
            const data = await fetch('/api/musteriler' + (q ? '?q=' + encodeURIComponent(q) : '')).then(r => r.json());
            renderMusteriler(data);
        } else {
            const hata = document.getElementById('form-hata');
            hata.textContent = res.error || 'Hata olustu';
            hata.style.display = 'block';
        }
    } finally {
        btn.disabled = false; btn.textContent = 'Kaydet';
    }
}

// Enter key in form
['f-adi','f-soyadi','f-telefon','f-il'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') kaydetMusteri(); });
});

// --- GECMIS MODAL ---
let gmAktifTelefon = '', gmAktifAd = '';

async function showGecmis(id, ad, telefon) {
    const adTemiz = ad.trim() || 'Musteri #' + id;
    gmAktifAd = adTemiz;
    gmAktifTelefon = telefon || '';

    document.getElementById('gm-baslik').textContent = adTemiz;
    document.getElementById('gm-badge').style.display = 'none';
    document.getElementById('gm-export').href = '/api/export/musteri/' + id;
    document.getElementById('gm-telefon').textContent = telefon || 'Telefon yok';
    document.getElementById('gm-ozet').innerHTML = '<div style="color:#999;padding:8px">Yukleniyor...</div>';
    document.getElementById('gm-satislar').innerHTML = '';
    document.getElementById('gm-chart').innerHTML = '';
    document.getElementById('gm-odeme').innerHTML = '';
    const waBtn = document.getElementById('gm-wa');
    waBtn.style.display = telefon ? 'block' : 'none';
    document.getElementById('gecmis-modal').style.display = 'flex';

    const [data, aylik] = await Promise.all([
        fetch('/api/musteri/' + id + '/gecmis').then(r => r.json()),
        fetch('/api/musteri/' + id + '/aylik').then(r => r.json()),
    ]);
    const o = data.ozet;

    // Badge
    const badge = document.getElementById('gm-badge');
    if (o.islem_adedi >= 20) {
        badge.textContent = 'Sadik Musteri';
        badge.style.cssText = 'display:inline;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#e8f5e9;color:#198754';
    } else if (o.islem_adedi >= 5) {
        badge.textContent = 'Duzenli';
        badge.style.cssText = 'display:inline;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#e3f2fd;color:#0d6efd';
    } else if (o.islem_adedi > 0) {
        badge.textContent = 'Yeni';
        badge.style.cssText = 'display:inline;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f8f9fa;color:#666';
    }

    // Ozet kartlar
    const veresiyeKart = o.veresiye_borc > 0
        ? `<div class="stat-card" style="padding:10px;border-left:3px solid #dc3545">
            <div style="font-size:16px;font-weight:700;color:#dc3545">${formatMoney(o.veresiye_borc)}</div>
            <div style="font-size:11px;color:#666">Acik Veresiye</div>
            <div style="font-size:11px;color:#999">${o.veresiye_bekleyen} islem</div>
           </div>` : '';

    document.getElementById('gm-ozet').innerHTML = `
        <div class="stat-card" style="padding:10px">
            <div style="font-size:17px;font-weight:700;color:#0d6efd">${formatMoney(o.toplam_harcama)}</div>
            <div style="font-size:11px;color:#666">Toplam Harcama</div>
        </div>
        <div class="stat-card" style="padding:10px">
            <div style="font-size:17px;font-weight:700">${o.islem_adedi}</div>
            <div style="font-size:11px;color:#666">Alisveris</div>
        </div>
        <div class="stat-card" style="padding:10px">
            <div style="font-size:17px;font-weight:700">${formatMoney(o.ort_fis)}</div>
            <div style="font-size:11px;color:#666">Ort. Fis</div>
        </div>
        <div class="stat-card" style="padding:10px">
            <div style="font-size:13px;font-weight:600">${o.ilk || '-'}</div>
            <div style="font-size:11px;color:#666">Ilk Alisveris</div>
        </div>
        <div class="stat-card" style="padding:10px">
            <div style="font-size:13px;font-weight:600">${o.son || '-'}</div>
            <div style="font-size:11px;color:#666">Son Alisveris</div>
        </div>
        ${veresiyeKart}
    `;

    // Odeme dagilimi
    const odemeAd = { N: 'Nakit', K: 'Kredi Karti', '1': 'Kredi Karti', V: 'Veresiye', T: 'Odendi' };
    const odemeRenk = { N: '#198754', K: '#0d6efd', '1': '#0d6efd', V: '#dc3545', T: '#6c757d' };
    document.getElementById('gm-odeme').innerHTML = Object.entries(data.odeme)
        .filter(([k]) => k && k !== 'T')
        .map(([k, v]) => `
            <div style="background:#f8f9fa;border:1px solid #dee2e6;border-radius:8px;padding:8px 14px;font-size:13px">
                <span style="color:${odemeRenk[k]||'#333'};font-weight:600">${odemeAd[k]||k}</span>:
                <strong>${formatMoney(v.tutar)}</strong>
                <span style="color:#999">(${v.islem} islem)</span>
            </div>`).join('');

    // Aylik bar grafik
    const chart = document.getElementById('gm-chart');
    if (aylik.length) {
        const maxC = Math.max(...aylik.map(a => a.ciro), 1);
        chart.innerHTML = '';
        aylik.forEach(a => {
            const pct = (a.ciro / maxC) * 90;
            const bar = document.createElement('div');
            bar.className = 'chart-bar';
            bar.style.height = Math.max(pct, a.ciro > 0 ? 6 : 2) + 'px';
            bar.title = `${a.etiket}: ${formatMoney(a.ciro)} (${a.islem} islem)`;
            bar.innerHTML = `<span class="bar-value">${formatShort(a.ciro)}</span><span class="bar-label">${a.etiket}</span>`;
            chart.appendChild(bar);
        });
    } else {
        chart.innerHTML = '<div style="text-align:center;padding:30px;color:#999">Veri yok</div>';
    }

    // Satis listesi
    const sekRenk = { N: '#198754', K: '#0d6efd', '1': '#0d6efd', V: '#dc3545', T: '#6c757d' };
    document.getElementById('gm-satislar').innerHTML = data.satislar.map(s => `
        <tr>
            <td>${s.tarih}</td>
            <td style="color:#666">${s.saat}</td>
            <td>#${s.fis_no}</td>
            <td><span style="color:${sekRenk[s.odeme]||'#333'};font-size:12px;font-weight:600">${odemeAd[s.odeme]||s.odeme||'-'}</span></td>
            <td style="text-align:right;font-weight:700">${formatMoney(s.tutar)}</td>
            <td><button class="btn btn-secondary" style="padding:2px 8px;font-size:11px" onclick="showSatisDetay('${s.id}',${s.fis_no},'${s.tarih}')">Detay</button></td>
        </tr>
    `).join('') || '<tr><td colspan="6" style="text-align:center;color:#999">Alisveris bulunamadi</td></tr>';
}

function gmOpenWA() {
    let tel = gmAktifTelefon.replace(/[\s\-\(\)\+]/g, '');
    if (tel.startsWith('0')) tel = '90' + tel.slice(1);
    else if (!tel.startsWith('90')) tel = '90' + tel;
    const msg = `Sayin ${gmAktifAd}, iyi gunler dileriz. Dincer Tavukculuk`;
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
}

function closeGecmis() {
    document.getElementById('gecmis-modal').style.display = 'none';
}
document.getElementById('gecmis-modal').addEventListener('click', function(e) {
    if (e.target === this) closeGecmis();
});

function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
}
</script>
{% endblock %}
