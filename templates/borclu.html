{% extends "base.html" %}
{% block title %}Borclu Musteriler - POS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Borclu Musteriler</h1>
</div>

<div id="ozet-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px"></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <input type="text" id="search" placeholder="Ad, soyad veya telefon..." oninput="filterTable()" style="flex:1;min-width:200px;padding:8px 12px;border:1px solid #dee2e6;border-radius:8px">
    <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-secondary yaslik-btn active" data-yaslik="tumu" onclick="setYaslik('tumu')">Tumu</button>
        <button class="btn btn-secondary yaslik-btn" data-yaslik="yeni" onclick="setYaslik('yeni')" style="color:#198754;border-color:#198754">Yeni &lt;7g</button>
        <button class="btn btn-secondary yaslik-btn" data-yaslik="orta" onclick="setYaslik('orta')" style="color:#fd7e14;border-color:#fd7e14">Orta 7-30g</button>
        <button class="btn btn-secondary yaslik-btn" data-yaslik="eski" onclick="setYaslik('eski')" style="color:#dc3545;border-color:#dc3545">Eski 30+g</button>
    </div>
    <a id="export-btn" href="/api/export/borclu" class="btn btn-secondary" style="white-space:nowrap">&#8595; Excel</a>
</div>

<div class="card">
    <div class="table-wrapper">
        <table id="borclu-table">
            <thead>
                <tr>
                    <th>Musteri</th>
                    <th>Telefon</th>
                    <th style="text-align:center">Islem</th>
                    <th style="text-align:right">Toplam Borc</th>
                    <th style="text-align:center">Kac Gun</th>
                    <th>Son Islem</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="borclu-tbody"></tbody>
            <tfoot>
                <tr>
                    <th colspan="3" style="text-align:right">GENEL TOPLAM</th>
                    <th id="genel-toplam" style="text-align:right"></th>
                    <th colspan="3"></th>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<!-- ODEME AL MODAL -->
<div id="odeme-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1100;justify-content:center;align-items:center">
    <div style="background:#fff;border-radius:12px;padding:24px;max-width:400px;width:90%;position:relative">
        <button onclick="closeOdeme()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;cursor:pointer">&times;</button>
        <h3 id="odeme-title" style="margin:0 0 4px"></h3>
        <p style="margin:0 0 16px;color:#666;font-size:13px">Toplam Borc: <strong id="odeme-toplam-label" style="color:#dc3545"></strong></p>
        <div class="form-group" style="margin-bottom:16px">
            <label style="font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:4px">Odeme Tutari (TL)</label>
            <input type="number" id="odeme-tutar" step="0.01" min="0.01" style="width:100%;padding:10px;font-size:18px;font-weight:700;border:2px solid #dee2e6;border-radius:8px;text-align:right;box-sizing:border-box">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-secondary" onclick="closeOdeme()">Iptal</button>
            <button class="btn btn-success btn-lg" onclick="confirmOdeme()">Odemeyi Onayla</button>
        </div>
    </div>
</div>

<!-- DETAY MODAL -->
<div id="detay-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center">
    <div style="background:#fff;border-radius:12px;padding:24px;max-width:640px;width:90%;max-height:85vh;overflow-y:auto;position:relative">
        <button onclick="closeDetay()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;cursor:pointer">&times;</button>
        <h3 id="detay-title" style="margin:0 0 4px"></h3>
        <p id="detay-telefon" style="margin:0 0 16px;color:#666;font-size:14px"></p>
        <div style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600">Toplam Borc:</span>
            <span id="detay-toplam" style="font-size:20px;font-weight:700;color:#dc3545"></span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Tarih</th><th>Saat</th><th>Fis No</th><th>Eleman</th><th style="text-align:right">Tutar</th><th></th></tr></thead>
                <tbody id="detay-tbody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<style>
.yaslik-btn.active { font-weight: 700; box-shadow: 0 0 0 2px currentColor inset; }
</style>
<script>
let allData = [];
let aktifYaslik = 'tumu';

document.addEventListener('DOMContentLoaded', loadBorclu);

async function loadBorclu() {
    const data = await fetch('/api/borclu').then(r => r.json());
    allData = data;
    renderOzet(data);
    renderTable(data);
}

function renderOzet(data) {
    const toplamBorc = data.reduce((s, m) => s + m.toplam_borc, 0);
    const kisiSayisi = data.length;
    const topIslem = data.reduce((s, m) => s + m.veresiye_sayisi, 0);
    const eskiSayisi = data.filter(m => m.yaslik === 'eski').length;
    const eskiBorc = data.filter(m => m.yaslik === 'eski').reduce((s, m) => s + m.toplam_borc, 0);

    document.getElementById('ozet-cards').innerHTML = `
        <div class="stat-card"><div class="stat-value" style="color:#dc3545">${formatMoney(toplamBorc)}</div><div class="stat-label">Toplam Borc</div></div>
        <div class="stat-card"><div class="stat-value">${kisiSayisi}</div><div class="stat-label">Borclu Musteri</div></div>
        <div class="stat-card"><div class="stat-value">${topIslem}</div><div class="stat-label">Veresiye Islem</div></div>
        <div class="stat-card" style="border-left:4px solid #dc3545;cursor:pointer" onclick="setYaslik('eski')">
            <div class="stat-value" style="color:#dc3545">${eskiSayisi}</div>
            <div class="stat-label">30+ Gun Bekleyen</div>
            <div style="font-size:12px;color:#999;margin-top:2px">${formatMoney(eskiBorc)}</div>
        </div>
    `;
}

function renderTable(data) {
    const tbody = document.getElementById('borclu-tbody');
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#999">Borclu musteri bulunamadi</td></tr>';
        document.getElementById('genel-toplam').textContent = '';
        return;
    }
    let genel = 0;
    tbody.innerHTML = data.map(m => {
        genel += m.toplam_borc;
        const borcRenk = m.toplam_borc > 1000 ? '#dc3545' : m.toplam_borc > 200 ? '#fd7e14' : '#333';
        const gunRenk = m.yaslik === 'eski' ? '#dc3545' : m.yaslik === 'orta' ? '#fd7e14' : '#198754';
        const gunBadge = m.gun > 0
            ? `<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600;background:${m.yaslik==='eski'?'#fde8e8':m.yaslik==='orta'?'#fff3e0':'#e8f5e9'};color:${gunRenk}">${m.gun}g</span>`
            : '<span style="color:#999;font-size:12px">-</span>';
        return `<tr>
            <td style="cursor:pointer" onclick="showDetay(${m.id}, '${escHtml(m.adi + ' ' + m.soyadi)}', '${escHtml(m.telefon)}', ${m.toplam_borc})"><strong>${escHtml(m.adi)} ${escHtml(m.soyadi)}</strong></td>
            <td>${escHtml(m.telefon)}</td>
            <td style="text-align:center">${m.veresiye_sayisi}</td>
            <td style="text-align:right;font-weight:700;color:${borcRenk}">${formatMoney(m.toplam_borc)}</td>
            <td style="text-align:center">${gunBadge}</td>
            <td>${m.son_islem}</td>
            <td>
                <div style="display:flex;gap:4px;flex-wrap:wrap">
                    <button class="btn btn-success" style="padding:4px 12px;font-size:13px;white-space:nowrap" onclick="openOdeme(${m.id},'${escHtml(m.adi + ' ' + m.soyadi)}',${m.toplam_borc})">Odeme Al</button>
                    ${m.telefon ? `<button onclick="openWA('${escHtml(m.telefon)}','${escHtml(m.adi + ' ' + m.soyadi)}',${m.toplam_borc})" style="padding:4px 10px;font-size:13px;white-space:nowrap;background:#25D366;border:none;border-radius:8px;color:#fff;cursor:pointer;font-weight:600">&#128492;</button>` : ''}
                </div>
            </td>
        </tr>`;
    }).join('');
    document.getElementById('genel-toplam').innerHTML = `<strong style="color:#dc3545">${formatMoney(genel)}</strong>`;
}

function setYaslik(yaslik) {
    aktifYaslik = yaslik;
    document.querySelectorAll('.yaslik-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.yaslik === yaslik);
    });
    filterTable();
}

function filterTable() {
    const q = document.getElementById('search').value.toLowerCase();
    let data = allData;
    if (aktifYaslik !== 'tumu') data = data.filter(m => m.yaslik === aktifYaslik);
    if (q) data = data.filter(m =>
        (m.adi + ' ' + m.soyadi).toLowerCase().includes(q) ||
        m.telefon.includes(q)
    );
    renderTable(data);
}

async function showDetay(id, ad, telefon, toplam) {
    document.getElementById('detay-title').textContent = ad;
    document.getElementById('detay-telefon').textContent = telefon || 'Telefon yok';
    document.getElementById('detay-toplam').textContent = formatMoney(toplam);
    document.getElementById('detay-tbody').innerHTML = '<tr><td colspan="6">Yukleniyor...</td></tr>';
    document.getElementById('detay-modal').style.display = 'flex';

    const data = await fetch('/api/borclu/' + id).then(r => r.json());
    document.getElementById('detay-tbody').innerHTML = data.map(d => `
        <tr>
            <td>${d.tarih}</td>
            <td>${d.saat}</td>
            <td>#${d.fis_no}</td>
            <td>${escHtml(d.eleman)}</td>
            <td style="text-align:right;font-weight:600">${formatMoney(d.tutar)}</td>
            <td><button class="btn btn-secondary" style="padding:2px 8px;font-size:12px" onclick="showSatisDetay('${d.id}','${d.fis_no}','${d.tarih}')">Detay</button></td>
        </tr>
    `).join('') || '<tr><td colspan="6">Kayit bulunamadi</td></tr>';
}

function closeDetay() {
    document.getElementById('detay-modal').style.display = 'none';
}
document.getElementById('detay-modal').addEventListener('click', function(e) {
    if (e.target === this) closeDetay();
});

let odemeMusteri = null;

function openOdeme(id, ad, toplam) {
    odemeMusteri = { id, ad, toplam };
    document.getElementById('odeme-title').textContent = ad;
    document.getElementById('odeme-toplam-label').textContent = formatMoney(toplam);
    document.getElementById('odeme-tutar').value = toplam.toFixed(2);
    document.getElementById('odeme-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('odeme-tutar').select(), 50);
}

function closeOdeme() {
    document.getElementById('odeme-modal').style.display = 'none';
    odemeMusteri = null;
}
document.getElementById('odeme-modal').addEventListener('click', function(e) {
    if (e.target === this) closeOdeme();
});

async function confirmOdeme() {
    if (!odemeMusteri) return;
    const tutar = parseFloat(document.getElementById('odeme-tutar').value);
    if (!tutar || tutar <= 0) { alert('Gecerli bir tutar girin'); return; }
    if (tutar > odemeMusteri.toplam + 0.01) {
        if (!confirm(`Girilen tutar (${formatMoney(tutar)}) toplam borcu (${formatMoney(odemeMusteri.toplam)}) asiyor. Devam edilsin mi?`)) return;
    }

    const btn = document.querySelector('#odeme-modal .btn-success');
    btn.disabled = true; btn.textContent = 'Isleniyor...';

    try {
        const res = await fetch(`/api/borclu/${odemeMusteri.id}/odeme`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tutar })
        }).then(r => r.json());

        if (res.ok) {
            closeOdeme();
            await loadBorclu();
            alert(`Odeme alindi! ${res.odendi_sayisi} islem kapatildi.`);
        } else {
            alert('Hata: ' + (res.error || 'Bilinmeyen hata'));
        }
    } catch(e) {
        alert('Hata: ' + e.message);
    } finally {
        btn.disabled = false; btn.textContent = 'Odemeyi Onayla';
    }
}

function openWA(telefon, ad, tutar) {
    let tel = (telefon || '').replace(/[\s\-\(\)\+]/g, '');
    if (tel.startsWith('0')) tel = '90' + tel.slice(1);
    else if (!tel.startsWith('90')) tel = '90' + tel;
    const msg = `Sayin ${ad}, ${formatMoney(tutar)} tutarindaki borcunuzu odemenizi rica ederiz. Tesekkurler, Dincer Tavukculuk`;
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
}

function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
{% endblock %}
