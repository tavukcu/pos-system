{% extends "base.html" %}
{% block title %}Karsilastirmali Rapor - POS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Karsilastirmali Rapor</h1>
</div>

<!-- FİLTRE -->
<div class="card" style="padding:14px;margin-bottom:20px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-secondary hizli-btn active" data-tip="hafta" onclick="switchTab('hafta')">Bu Hafta vs Gecen Hafta</button>
        <button class="btn btn-secondary hizli-btn" data-tip="ay" onclick="switchTab('ay')">Bu Ay vs Gecen Ay</button>
    </div>
</div>

<!-- OZET KARTLAR -->
<div id="ozet-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px"></div>

<!-- GRAFIK -->
<div class="card" style="margin-bottom:20px">
    <h2 id="grafik-baslik" style="margin-bottom:12px"></h2>
    <div style="display:flex;gap:16px;margin-bottom:12px;font-size:13px">
        <span style="display:flex;align-items:center;gap:6px">
            <span style="width:16px;height:4px;background:#2563eb;display:inline-block;border-radius:2px"></span>Bu donem
        </span>
        <span style="display:flex;align-items:center;gap:6px">
            <span style="width:16px;height:4px;background:#cbd5e1;display:inline-block;border-radius:2px;border:1px dashed #94a3b8"></span>Gecen donem
        </span>
    </div>
    <div style="overflow-x:auto">
        <div class="chart-container" id="grafik" style="height:220px;margin-bottom:16px"></div>
    </div>
</div>

<!-- TABLO -->
<div class="card">
    <h2 id="tablo-baslik" style="margin-bottom:12px"></h2>
    <div class="table-wrapper">
        <table>
            <thead id="tablo-head"></thead>
            <tbody id="tablo-body"></tbody>
            <tfoot id="tablo-foot"></tfoot>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<style>
.hizli-btn.active { background:#2563eb !important; color:#fff !important; }
.degisim-up   { color:#10b981; font-size:12px; font-weight:600; }
.degisim-down { color:#ef4444; font-size:12px; font-weight:600; }
</style>
<script>
document.addEventListener('DOMContentLoaded', () => switchTab('hafta'));

function switchTab(tab) {
    document.querySelectorAll('.hizli-btn').forEach(b => b.classList.toggle('active', b.dataset.tip === tab));
    loadData(tab);
}

async function loadData(tip) {
    const data = await fetch('/api/rapor/karsilastirma?tip=' + tip).then(r => r.json());
    renderOzet(data, tip);
    renderGrafik(data, tip);
    renderTablo(data, tip);
}

function degisim(yeni, eski) {
    if (eski === 0) return yeni > 0 ? '<span class="degisim-up">&#9650; Yeni</span>' : '';
    const pct = (yeni - eski) / eski * 100;
    const cls = pct >= 0 ? 'degisim-up' : 'degisim-down';
    const isaret = pct >= 0 ? '&#9650;' : '&#9660;';
    return `<span class="${cls}">${isaret} ${Math.abs(pct).toFixed(1)}%</span>`;
}

function renderOzet(d, tip) {
    const buCiro  = d.bu_donem.reduce((s, r) => s + r.ciro, 0);
    const gCiro   = d.gecen_donem.reduce((s, r) => s + r.ciro, 0);
    const buIslem = d.bu_donem.reduce((s, r) => s + r.islem, 0);
    const gIslem  = d.gecen_donem.reduce((s, r) => s + r.islem, 0);
    const buOrt   = buIslem > 0 ? buCiro / buIslem : 0;
    const gOrt    = gIslem  > 0 ? gCiro  / gIslem  : 0;
    const donem   = tip === 'hafta' ? 'hafta' : 'ay';

    document.getElementById('ozet-cards').innerHTML = `
        <div class="stat-card" style="border-top:3px solid #2563eb">
            <div class="label">Bu ${donem} Ciro</div>
            <div class="value" style="color:#2563eb">${formatMoney(buCiro)}</div>
            <div style="font-size:12px;color:#999;margin-top:6px">
                Gecen: ${formatMoney(gCiro)} &nbsp; ${degisim(buCiro, gCiro)}
            </div>
        </div>
        <div class="stat-card" style="border-top:3px solid #10b981">
            <div class="label">Bu ${donem} Islem</div>
            <div class="value" style="color:#10b981">${buIslem}</div>
            <div style="font-size:12px;color:#999;margin-top:6px">
                Gecen: ${gIslem} &nbsp; ${degisim(buIslem, gIslem)}
            </div>
        </div>
        <div class="stat-card" style="border-top:3px solid #f59e0b">
            <div class="label">Ort. Fis</div>
            <div class="value" style="color:#f59e0b">${formatMoney(buOrt)}</div>
            <div style="font-size:12px;color:#999;margin-top:6px">
                Gecen: ${formatMoney(gOrt)} &nbsp; ${degisim(buOrt, gOrt)}
            </div>
        </div>
    `;
}

function renderGrafik(d, tip) {
    document.getElementById('grafik-baslik').textContent =
        tip === 'hafta' ? 'Bu Hafta vs Gecen Hafta' : 'Bu Ay vs Gecen Ay';

    const chart = document.getElementById('grafik');
    chart.innerHTML = '';

    const tumCirolar = [...d.bu_donem.map(r => r.ciro), ...d.gecen_donem.map(r => r.ciro)];
    const maxCiro = Math.max(...tumCirolar, 1);
    const len = Math.max(d.bu_donem.length, d.gecen_donem.length);

    for (let i = 0; i < len; i++) {
        const bu = d.bu_donem[i]    || { ciro: 0, etiket: '' };
        const g  = d.gecen_donem[i] || { ciro: 0, etiket: '' };

        const group = document.createElement('div');
        group.style.cssText = 'display:flex;flex-direction:column;align-items:center;flex:1;min-width:28px;gap:2px';

        const bars = document.createElement('div');
        bars.style.cssText = 'display:flex;gap:2px;align-items:flex-end;height:200px';

        const b1 = document.createElement('div');
        b1.style.cssText = `width:14px;background:#2563eb;border-radius:3px 3px 0 0;height:${Math.max((bu.ciro/maxCiro)*190,2)}px;cursor:pointer`;
        b1.title = (bu.etiket || '') + ': ' + formatMoney(bu.ciro);

        const b2 = document.createElement('div');
        b2.style.cssText = `width:14px;background:#cbd5e1;border-radius:3px 3px 0 0;height:${Math.max((g.ciro/maxCiro)*190, g.ciro>0?2:0)}px;cursor:pointer`;
        b2.title = 'Gecen: ' + formatMoney(g.ciro);

        bars.appendChild(b1);
        bars.appendChild(b2);

        const lbl = document.createElement('div');
        lbl.style.cssText = 'font-size:10px;color:#666;text-align:center;margin-top:4px;white-space:nowrap';
        lbl.textContent = bu.etiket || g.etiket;

        group.appendChild(bars);
        group.appendChild(lbl);
        chart.appendChild(group);
    }
}

function renderTablo(d, tip) {
    document.getElementById('tablo-baslik').textContent = 'Gunluk Detay';

    document.getElementById('tablo-head').innerHTML = `
        <tr>
            <th>Gun</th>
            <th style="text-align:right;color:#2563eb">Bu Donem Ciro</th>
            <th style="text-align:center;color:#2563eb">Islem</th>
            <th style="text-align:right;color:#94a3b8">Gecen Donem Ciro</th>
            <th style="text-align:center;color:#94a3b8">Islem</th>
            <th style="text-align:right">Fark</th>
        </tr>`;

    const len = Math.max(d.bu_donem.length, d.gecen_donem.length);
    let topBu = 0, topG = 0, topBuI = 0, topGI = 0;
    const rows = [];

    for (let i = 0; i < len; i++) {
        const bu = d.bu_donem[i]    || { ciro: 0, islem: 0, etiket: '-' };
        const g  = d.gecen_donem[i] || { ciro: 0, islem: 0, etiket: '-' };
        const fark = bu.ciro - g.ciro;
        const farkRenk = fark > 0 ? '#10b981' : fark < 0 ? '#ef4444' : '#666';
        topBu += bu.ciro; topG += g.ciro; topBuI += bu.islem; topGI += g.islem;
        rows.push(`<tr>
            <td><strong>${bu.etiket || g.etiket}</strong></td>
            <td style="text-align:right">${bu.ciro > 0 ? formatMoney(bu.ciro) : '-'}</td>
            <td style="text-align:center">${bu.islem || '-'}</td>
            <td style="text-align:right;color:#94a3b8">${g.ciro > 0 ? formatMoney(g.ciro) : '-'}</td>
            <td style="text-align:center;color:#94a3b8">${g.islem || '-'}</td>
            <td style="text-align:right;font-weight:700;color:${farkRenk}">${fark !== 0 ? (fark > 0 ? '+' : '') + formatMoney(fark) : '-'}</td>
        </tr>`);
    }

    document.getElementById('tablo-body').innerHTML = rows.join('');

    const totFark = topBu - topG;
    const totRenk = totFark > 0 ? '#10b981' : totFark < 0 ? '#ef4444' : '#666';
    document.getElementById('tablo-foot').innerHTML = `
        <tr style="font-weight:700;background:#f8fafc">
            <th>TOPLAM</th>
            <th style="text-align:right">${formatMoney(topBu)}</th>
            <th style="text-align:center">${topBuI}</th>
            <th style="text-align:right;color:#94a3b8">${formatMoney(topG)}</th>
            <th style="text-align:center;color:#94a3b8">${topGI}</th>
            <th style="text-align:right;color:${totRenk}">${totFark > 0 ? '+' : ''}${formatMoney(totFark)}</th>
        </tr>`;
}
</script>
{% endblock %}
