{% extends "base.html" %}
{% block title %}Alis Faturalari - POS{% endblock %}
{% block content %}
<div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <h1>Alis Faturalari</h1>
</div>

<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0">Fatura Listesi <span id="fatura-sayisi" style="font-size:13px;font-weight:400;color:#666"></span></h2>
        <select id="filtre-tedarikci" onchange="yukleListe()" style="padding:6px 10px;border:1px solid #dee2e6;border-radius:8px;font-size:13px;min-width:160px">
            <option value="">Tum Tedarikciler</option>
        </select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
        <input type="date" id="filtre-bas" onchange="yukleListe()" style="padding:6px 10px;border:1px solid #dee2e6;border-radius:8px;font-size:13px">
        <span style="color:#999;font-size:13px">—</span>
        <input type="date" id="filtre-bit" onchange="yukleListe()" style="padding:6px 10px;border:1px solid #dee2e6;border-radius:8px;font-size:13px">
        <button onclick="filtreTemizle()" style="padding:5px 10px;border:1px solid #dee2e6;border-radius:8px;font-size:12px;background:#f8f9fa;cursor:pointer;color:#666">Temizle</button>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Tarih</th>
                    <th>Tedarikci</th>
                    <th style="text-align:center">Urun</th>
                    <th style="text-align:right">Toplam</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="liste-tbody">
                <tr><td colspan="5" style="text-align:center;color:#999;padding:20px">Yukleniyor...</td></tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3" style="text-align:right;font-size:13px;color:#666">TOPLAM</th>
                    <th id="liste-toplam" style="text-align:right;color:#0d6efd;font-size:15px"></th>
                    <th></th>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<!-- DETAY MODAL -->
<div id="detay-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center">
    <div style="background:#fff;border-radius:12px;padding:24px;max-width:580px;width:92%;max-height:80vh;overflow-y:auto;position:relative">
        <button onclick="closeDetay()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;cursor:pointer">&times;</button>
        <h3 id="detay-baslik" style="margin:0 0 16px"></h3>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Urun</th><th style="text-align:right">Miktar</th><th style="text-align:right">Fiyat</th><th style="text-align:right">Tutar</th></tr></thead>
                <tbody id="detay-tbody"></tbody>
                <tfoot><tr><th colspan="3" style="text-align:right">TOPLAM</th><th id="detay-toplam" style="text-align:right"></th></tr></tfoot>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    yukleTedarikciler();
    yukleListe();
});

async function yukleTedarikciler() {
    const data = await fetch('/api/alis-faturasi/tedarikciler').then(r => r.json());
    const sel = document.getElementById('filtre-tedarikci');
    data.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.firma_id;
        opt.textContent = t.ad;
        sel.appendChild(opt);
    });
}

function filtreTemizle() {
    document.getElementById('filtre-tedarikci').value = '';
    document.getElementById('filtre-bas').value = '';
    document.getElementById('filtre-bit').value = '';
    yukleListe();
}

async function yukleListe() {
    const firmaId = document.getElementById('filtre-tedarikci').value;
    const bas = document.getElementById('filtre-bas').value;
    const bit = document.getElementById('filtre-bit').value;
    const params = new URLSearchParams();
    if (firmaId) params.append('firma_id', firmaId);
    if (bas) params.append('bas', bas);
    if (bit) params.append('bit', bit);
    const url = '/api/alis-faturasi/liste' + (params.toString() ? '?' + params.toString() : '');
    const data = await fetch(url).then(r => r.json());
    const genelToplam = data.reduce((s, f) => s + (f.toplam || 0), 0);
    document.getElementById('liste-toplam').textContent = formatMoney(genelToplam);
    document.getElementById('fatura-sayisi').textContent = data.length ? `(${data.length} fatura)` : '';
    document.getElementById('liste-tbody').innerHTML = data.length
        ? data.map(f => `
            <tr>
                <td><strong>${f.tarih}</strong></td>
                <td style="font-size:13px">${esc(f.tedarikci)}</td>
                <td style="text-align:center;color:#666">${f.satir}</td>
                <td style="text-align:right;font-weight:600">${formatMoney(f.toplam)}</td>
                <td><button class="btn btn-secondary" style="padding:2px 8px;font-size:11px" onclick="showDetay(${f.fis_id},'${f.tarih} - ${esc(f.tedarikci)}')">Detay</button></td>
            </tr>`).join('')
        : '<tr><td colspan="5" style="text-align:center;color:#999;padding:20px">Kayit yok</td></tr>';
}

async function showDetay(fis_id, tarih) {
    document.getElementById('detay-baslik').textContent = tarih + ' tarihli fatura';
    document.getElementById('detay-tbody').innerHTML = '<tr><td colspan="4">Yukleniyor...</td></tr>';
    document.getElementById('detay-modal').style.display = 'flex';

    const data = await fetch('/api/alis-faturasi/' + fis_id).then(r => r.json());
    let toplam = 0;
    document.getElementById('detay-tbody').innerHTML = data.map(d => {
        toplam += d.tutar;
        return `<tr>
            <td>${esc(d.urun)}</td>
            <td style="text-align:right">${d.miktar.toFixed(3)} ${esc(d.birim)}</td>
            <td style="text-align:right">${formatMoney(d.fiyat)}</td>
            <td style="text-align:right;font-weight:600">${formatMoney(d.tutar)}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="4" style="text-align:center;color:#999">Kayit yok</td></tr>';
    document.getElementById('detay-toplam').innerHTML = `<strong>${formatMoney(toplam)}</strong>`;
}

function closeDetay() {
    document.getElementById('detay-modal').style.display = 'none';
}
document.getElementById('detay-modal').addEventListener('click', function(e) {
    if (e.target === this) closeDetay();
});

function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
}
</script>
{% endblock %}
