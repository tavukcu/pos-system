{% extends "base.html" %}
{% block title %}Stok Durumu - POS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Stok Durumu <span style="font-size:13px;font-weight:400;color:#666">Son 30 Gun | Bugun vs Ort.</span></h1>
    <button class="btn btn-secondary" onclick="exportExcel()">&#8595; Excel</button>
</div>

<!-- ÖZET KARTLAR -->
<div id="ozet-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px"></div>

<!-- FİLTRE + ARAMA -->
<div class="card" style="padding:14px;margin-bottom:20px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-secondary filtre-btn active" id="f-hepsi"     onclick="setFiltre('hepsi')">Tumu</button>
        <button class="btn btn-secondary filtre-btn" id="f-bugun"     onclick="setFiltre('bugun')">Bugun Satilan</button>
        <button class="btn btn-secondary filtre-btn" id="f-satilmadi" onclick="setFiltre('satilmadi')">&#9888; Satilmadi</button>
        <button class="btn btn-secondary filtre-btn" id="f-hizli"     onclick="setFiltre('hizli')">&#9650; Hizli</button>
        <button class="btn btn-secondary filtre-btn" id="f-yavas"     onclick="setFiltre('yavas')">&#9660; Yavas</button>
        <button class="btn btn-secondary filtre-btn" id="f-kritik"    onclick="setFiltre('kritik')">&#9888; Kritik Stok</button>
        <input type="text" id="ara" placeholder="Urun ara..." oninput="filtrele()"
            style="margin-left:auto;padding:6px 12px;border:1px solid #dee2e6;border-radius:8px;font-size:13px;width:200px">
    </div>
</div>

<!-- TABLO -->
<div class="card">
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Urun</th>
                    <th style="text-align:right">Mevcut Stok</th>
                    <th style="text-align:right">Bugun</th>
                    <th style="text-align:right">Bugun Tutar</th>
                    <th style="text-align:right">Ort./Gun</th>
                    <th style="text-align:right">30G Toplam</th>
                    <th style="text-align:center">Durum</th>
                </tr>
            </thead>
            <tbody id="stok-tbody">
                <tr><td colspan="7" style="text-align:center;padding:32px;color:#999">Yukleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<style>
.badge-satilmadi { background:#dc3545;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600 }
.badge-yavas     { background:#ffc107;color:#000;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600 }
.badge-normal    { background:#198754;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600 }
.badge-hizli     { background:#0d6efd;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600 }
.filtre-btn.active { background:#2563eb !important; color:#fff !important; }
</style>
{% endblock %}

{% block scripts %}
<script>
let allData = [];
let aktifFiltre = 'hepsi';

document.addEventListener('DOMContentLoaded', yukle);

async function yukle() {
    allData = await fetch('/api/stok/durum').then(r => r.json());
    renderOzet(allData);
    filtrele();
}

function renderOzet(data) {
    const satilmadi  = data.filter(d => d.durum === 'satilmadi').length;
    const hizli      = data.filter(d => d.durum === 'hizli').length;
    const kritik     = data.filter(d => d.net_stok <= 0).length;
    const bugunCesit = data.filter(d => d.bugun_miktar > 0).length;
    const bugunTop   = data.reduce((s, d) => s + d.bugun_tutar, 0);

    document.getElementById('ozet-cards').innerHTML = `
        <div class="stat-card">
            <div class="label">Aktif Urun (30G)</div>
            <div class="value primary">${data.length}</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="setFiltre('bugun')">
            <div class="label">Bugun Satilan Cesit</div>
            <div class="value success">${bugunCesit}</div>
        </div>
        <div class="stat-card">
            <div class="label">Bugun Ciro</div>
            <div class="value success">${formatMoney(bugunTop)}</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="setFiltre('kritik')">
            <div class="label">Kritik Stok</div>
            <div class="value" style="color:#dc3545">${kritik}</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="setFiltre('hizli')">
            <div class="label">Hizli Satan</div>
            <div class="value" style="color:#2563eb">${hizli}</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="setFiltre('satilmadi')">
            <div class="label">Bugun Satilmadi</div>
            <div class="value" style="color:#dc3545">${satilmadi}</div>
        </div>
    `;
}

function setFiltre(f) {
    aktifFiltre = f;
    ['hepsi','satilmadi','hizli','yavas','bugun','kritik'].forEach(id => {
        document.getElementById('f-' + id).classList.toggle('active', id === f);
    });
    filtrele();
}

function filtrele() {
    const q = document.getElementById('ara').value.toLowerCase();
    let data = allData;
    if (aktifFiltre === 'satilmadi') data = data.filter(d => d.durum === 'satilmadi');
    else if (aktifFiltre === 'hizli')  data = data.filter(d => d.durum === 'hizli');
    else if (aktifFiltre === 'yavas')  data = data.filter(d => d.durum === 'yavas');
    else if (aktifFiltre === 'bugun')  data = data.filter(d => d.bugun_miktar > 0);
    else if (aktifFiltre === 'kritik') data = data.filter(d => d.net_stok <= 0);
    if (q) data = data.filter(d => d.ad.toLowerCase().includes(q) || d.kod.toLowerCase().includes(q));
    renderTablo(data);
}

function renderTablo(data) {
    if (!data.length) {
        document.getElementById('stok-tbody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#999">Kayit bulunamadi</td></tr>';
        return;
    }
    const fmt = (val, birim) => birim === 'KG' ? val.toFixed(2) + ' KG' : val.toFixed(0) + ' ' + birim;
    document.getElementById('stok-tbody').innerHTML = data.map(d => {
        const rowBg = d.net_stok <= 0     ? 'background:#fff5f5' :
                      d.durum === 'yavas' ? 'background:#fffdf0' :
                      d.durum === 'hizli' ? 'background:#f0f7ff' : '';
        const badge = `<span class="badge-${d.durum}">${
            d.durum === 'satilmadi' ? 'SATILMADI' :
            d.durum === 'hizli'    ? '&#9650; HIZLI' :
            d.durum === 'yavas'    ? '&#9660; YAVAS' : 'NORMAL'
        }</span>`;
        const stokRenk = d.net_stok > 0 ? '#198754' : d.net_stok === 0 ? '#999' : '#dc3545';
        const stokIcon = d.net_stok < 0 ? '&#9888; ' : '';
        return `<tr style="${rowBg}">
            <td><strong>${esc(d.ad)}</strong><br><span style="font-size:11px;color:#999">${esc(d.kod)}</span></td>
            <td style="text-align:right"><span style="font-weight:700;color:${stokRenk}">${stokIcon}${fmt(Math.abs(d.net_stok), d.birim)}${d.net_stok < 0 ? ' (-)' : ''}</span></td>
            <td style="text-align:right;font-weight:700;color:${d.bugun_miktar > 0 ? '#0d6efd' : '#ccc'}">${d.bugun_miktar > 0 ? fmt(d.bugun_miktar, d.birim) : '-'}</td>
            <td style="text-align:right">${d.bugun_tutar > 0 ? formatMoney(d.bugun_tutar) : '-'}</td>
            <td style="text-align:right;color:#666">${d.ort_gunluk > 0 ? fmt(d.ort_gunluk, d.birim) : '-'}</td>
            <td style="text-align:right;color:#666">${fmt(d.cikis_30, d.birim)}</td>
            <td style="text-align:center">${badge}</td>
        </tr>`;
    }).join('');
}

function exportExcel() { window.location = '/api/export/stok_durumu'; }

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
{% endblock %}
