{% extends "base.html" %}
{% block title %}Satis Hizi - POS{% endblock %}
{% block content %}
<div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <h1>Satis Hizi <span style="font-size:13px;font-weight:400;color:#666">(Son 30 Gun | Bugun vs Ort.)</span></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="text" id="ara" placeholder="Urun ara..." oninput="filtrele()" style="padding:8px 12px;border:1px solid #dee2e6;border-radius:8px;font-size:14px;width:200px">
        <button class="btn btn-secondary" onclick="exportExcel()">&#8595; Excel</button>
    </div>
</div>

<!-- OZET KARTLAR -->
<div id="ozet-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px"></div>

<!-- FILTRE BUTONLARI -->
<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm active-filtre" id="f-hepsi"     onclick="setFiltre('hepsi')">Tumu</button>
    <button class="btn btn-secondary btn-sm" id="f-satilmadi" onclick="setFiltre('satilmadi')">&#9888; Bugun Satilmadi</button>
    <button class="btn btn-secondary btn-sm" id="f-hizli"     onclick="setFiltre('hizli')">&#9650; Hizli</button>
    <button class="btn btn-secondary btn-sm" id="f-yavas"     onclick="setFiltre('yavas')">&#9660; Yavas</button>
    <button class="btn btn-secondary btn-sm" id="f-bugun"     onclick="setFiltre('bugun')">Bugun Satilan</button>
</div>

<div class="card">
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Urun</th>
                    <th style="text-align:right">Bugun</th>
                    <th style="text-align:right">Bugun Tutar</th>
                    <th style="text-align:right">Ort./Gun</th>
                    <th style="text-align:right">30G Toplam</th>
                    <th style="text-align:center">Durum</th>
                </tr>
            </thead>
            <tbody id="stok-tbody"></tbody>
        </table>
    </div>
</div>

<style>
.badge-satilmadi { background:#dc3545;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600 }
.badge-yavas     { background:#ffc107;color:#000;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600 }
.badge-normal    { background:#198754;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600 }
.badge-hizli     { background:#0d6efd;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600 }
.btn-sm { padding:6px 12px;font-size:12px; }
.active-filtre { background:var(--primary) !important;color:#fff !important;border-color:var(--primary) !important; }
</style>
{% endblock %}

{% block scripts %}
<script>
let allData = [];
let aktifFiltre = 'hepsi';

document.addEventListener('DOMContentLoaded', yukle);

async function yukle() {
    document.getElementById('stok-tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:#999">Yukleniyor...</td></tr>';
    allData = await fetch('/api/stok/durum').then(r => r.json());
    renderOzet(allData);
    filtrele();
}

function renderOzet(data) {
    const satilmadi = data.filter(d => d.durum === 'satilmadi').length;
    const hizli     = data.filter(d => d.durum === 'hizli').length;
    const yavas     = data.filter(d => d.durum === 'yavas').length;
    const bugunTop  = data.reduce((s, d) => s + d.bugun_tutar, 0);
    const bugunCesit = data.filter(d => d.bugun_miktar > 0).length;

    document.getElementById('ozet-cards').innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${data.length}</div>
            <div class="stat-label">Aktif Urun (30G)</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="setFiltre('bugun')">
            <div class="stat-value" style="color:#198754">${bugunCesit}</div>
            <div class="stat-label">Bugun Satilan Cesit</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="setFiltre('satilmadi')">
            <div class="stat-value" style="color:#dc3545">${satilmadi}</div>
            <div class="stat-label">Bugun Satilmadi</div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="setFiltre('hizli')">
            <div class="stat-value" style="color:#0d6efd">${hizli}</div>
            <div class="stat-label">Hizli Satan</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color:#198754">${formatMoney(bugunTop)}</div>
            <div class="stat-label">Bugun Ciro</div>
        </div>
    `;
}

function setFiltre(f) {
    aktifFiltre = f;
    ['hepsi','satilmadi','hizli','yavas','bugun'].forEach(id => {
        document.getElementById('f-' + id).classList.toggle('active-filtre', id === f);
    });
    filtrele();
}

function filtrele() {
    const q = document.getElementById('ara').value.toLowerCase();
    let data = allData;

    if (aktifFiltre === 'satilmadi') data = data.filter(d => d.durum === 'satilmadi');
    else if (aktifFiltre === 'hizli')  data = data.filter(d => d.durum === 'hizli');
    else if (aktifFiltre === 'yavas')  data = data.filter(d => d.durum === 'yavas');
    else if (aktifFiltre === 'bugun')  data = data.filter(d => d.bugun_miktar > 0);

    if (q) data = data.filter(d => d.ad.toLowerCase().includes(q) || d.kod.toLowerCase().includes(q));

    renderTablo(data);
}

function renderTablo(data) {
    if (!data.length) {
        document.getElementById('stok-tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:#999">Kayit bulunamadi</td></tr>';
        return;
    }
    const fmt = (val, birim) => birim === 'KG' ? val.toFixed(2) + ' KG' : val.toFixed(0) + ' ' + birim;
    document.getElementById('stok-tbody').innerHTML = data.map(d => {
        const rowBg = d.durum === 'satilmadi' ? 'background:#fff5f5' :
                      d.durum === 'yavas'     ? 'background:#fffdf0' :
                      d.durum === 'hizli'     ? 'background:#f0f7ff' : '';
        const badge = `<span class="badge-${d.durum}">${
            d.durum === 'satilmadi' ? 'SATILMADI' :
            d.durum === 'hizli'    ? '&#9650; HIZLI' :
            d.durum === 'yavas'    ? '&#9660; YAVAS' : 'NORMAL'
        }</span>`;
        const ortBar = d.ort_gunluk > 0 ? `<div style="font-size:10px;color:#999;margin-top:2px">${fmt(d.ort_gunluk, d.birim)}/gun ort.</div>` : '';
        return `<tr style="${rowBg}">
            <td><strong>${esc(d.ad)}</strong><br><span style="font-size:11px;color:#999">${esc(d.kod)}</span></td>
            <td style="text-align:right;font-weight:700;color:${d.bugun_miktar > 0 ? '#0d6efd' : '#ccc'}">${d.bugun_miktar > 0 ? fmt(d.bugun_miktar, d.birim) : '-'}</td>
            <td style="text-align:right">${d.bugun_tutar > 0 ? formatMoney(d.bugun_tutar) : '-'}</td>
            <td style="text-align:right;color:#666">${d.ort_gunluk > 0 ? fmt(d.ort_gunluk, d.birim) : '-'}</td>
            <td style="text-align:right;color:#666">${fmt(d.cikis_30, d.birim)}</td>
            <td style="text-align:center">${badge}</td>
        </tr>`;
    }).join('');
}

function exportExcel() {
    window.location = '/api/export/stok_durumu';
}

function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
{% endblock %}
